spring.application.name=universal-excel-cleaner
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
spring.servlet.multipart.file-size-threshold=11MB
server.address=127.0.0.1
server.tomcat.connection-timeout=10s
server.tomcat.threads.max=12
server.tomcat.threads.min-spare=2
server.tomcat.max-part-count=8
server.tomcat.max-swallow-size=11MB
server.error.include-message=never
logging.level.org.apache.poi=OFF
